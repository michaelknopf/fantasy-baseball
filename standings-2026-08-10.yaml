# Season point totals when the playoffs opened on 2026-08-10.
#
# Fantrax serves only a team's *current* total -- there is no historical
# standings call -- and our first snapshot is 2026-08-13, three days late.
# Teams scored 65-140 points over those three days, so the opening totals
# cannot be derived from any snapshot we hold. They are transcribed by hand
# from the league's standings page and recorded here as the source of truth
# that playoffs.yaml reads its round-1 baselines from.
#
# Transcribed from the league's playoff spreadsheet, whose "Starting Total
# Points" column is the same figure this file records. The four winners'-bracket
# values it shares with playoffs.yaml agree exactly, which is what vouches for
# the rest.
#
# `seed` is the league seeding. The consolation bracket re-seeds its four teams
# 1-4 internally; that ordering lives in playoffs.yaml, not here.

